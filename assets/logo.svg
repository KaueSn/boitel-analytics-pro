    <ellipse cx="32" cy="23.5" rx="3.4" ry="4.6"/>
    <ellipse cx="32" cy="31.5" rx="3.4" ry="4.6"/>
    <ellipse cx="25.2" cy="21.5" rx="4.6" ry="2.9" transform="rotate(-33 25.2 21.5)"/>
    <ellipse cx="38.8" cy="21.5" rx="4.6" ry="2.9" transform="rotate(33 38.8 21.5)"/>
    <ellipse cx="23.4" cy="28.5" rx="4.9" ry="3.1" transform="rotate(-31 23.4 28.5)"/>
    <ellipse cx="40.6" cy="28.5" rx="4.9" ry="3.1" transform="rotate(31 40.6 28.5)"/>
    <ellipse cx="22" cy="35.5" rx="5.1" ry="3.3" transform="rotate(-29 22 35.5)"/>
    <ellipse cx="42" cy="35.5" rx="5.1" ry="3.3" transform="rotate(29 42 35.5)"/>
