  </defs>

  <!-- Fundo (badge arredondado) -->
  <rect x="1" y="1" width="62" height="62" rx="16" fill="url(#bg)"/>
  <rect x="2.2" y="2.2" width="59.6" height="59.6" rx="14.8" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.4"/>

  <!-- Caule do trigo -->
  <path d="M32 54 V19" stroke="#0b5f59" stroke-width="2.6" stroke-linecap="round"/>

  <!-- Folha -->
  <path d="M32 51 C21.5 48.5 17.5 40 20 32.5 C29.5 35 33.5 42.5 32.5 51 Z" fill="#8fe3d4" opacity="0.95"/>

  <!-- Grãos -->
